<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manresa · Jugadores</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manresa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11141a; --bg-raised:#181c24;
    --line:#2a2f3a; --pink:#ff2d78; --pink-dim:#c21f5c;
    --text:#f2f1ee; --text-dim:#8b93a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; min-height:100dvh;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:460px;}
  header{text-align:center; margin-bottom:6px;}
  .eyebrow{
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--pink); font-weight:600; margin-bottom:6px;
  }
  h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:30px;
    letter-spacing:.01em; margin:0 0 14px; text-transform:uppercase;
  }
  .court-divider{display:block; width:100%; height:28px; margin:0 auto 26px;}
  .court-divider line, .court-divider circle{stroke:var(--pink-dim); stroke-width:2; fill:none;}
  nav{display:flex; flex-direction:column; gap:12px; margin-top:4px;}
  a.tile{
    display:flex; align-items:center; gap:16px; padding:20px 18px;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:14px;
    text-decoration:none; color:var(--text); position:relative; overflow:hidden;
  }
  a.tile:active{transform:scale(.97); background:#1e2330;}
  a.tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pink);}
  .tile-icon{
    flex:0 0 auto; width:44px; height:44px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,45,120,.08); color:var(--pink);
  }
  .tile-icon svg{width:22px; height:22px;}
  .tile-body{flex:1; min-width:0;}
  .tile-title{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px;
    letter-spacing:.01em; text-transform:uppercase; margin-bottom:2px;
  }
  .tile-sub{font-size:13px; color:var(--text-dim); line-height:1.35;}
  .tile-arrow{flex:0 0 auto; color:var(--text-dim); font-size:18px;}
  footer{margin-top:34px; text-align:center; font-size:11.5px; color:var(--text-dim);}
  #installBtn{
    display:none; margin:22px auto 0; padding:12px 22px;
    background:var(--pink); color:#11141a; border:none; border-radius:10px;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Bàsquet Manresa</div>
    <h1>COPA 26/27</h1>
    <svg class="court-divider" viewBox="0 0 460 28" preserveAspectRatio="none">
      <line x1="0" y1="26" x2="460" y2="26"/>
      <line x1="200" y1="26" x2="200" y2="6"/>
      <line x1="260" y1="26" x2="260" y2="6"/>
      <line x1="200" y1="6" x2="260" y2="6"/>
      <circle cx="230" cy="6" r="17"/>
    </svg>
  </header>

  <nav>
    <a class="tile" href="feedback.html">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>
      </div>
      <div class="tile-body">
        <div class="tile-title">Com estàs?</div>
        <div class="tile-sub">Digue'ns com t'ha anat l'entrenament</div>
      </div>
      <div class="tile-arrow">›</div>
    </a>

    <a class="tile" href="https://drive.google.com/drive/folders/1WHoasBalsq3pWMdm6xnGCvyoo8-MKgiJ?usp=drive_link" target="_blank" rel="noopener">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 9l4-2v10l-4-2"/></svg>
      </div>
      <div class="tile-body">
        <div class="tile-title">Vídeos nostres</div>
        <div class="tile-sub">Vídeos dels nostres partits</div>
      </div>
      <div class="tile-arrow">›</div>
    </a>

    <a class="tile" href="https://drive.google.com/drive/folders/1b_qMik7ob_nl2DfeAwre1rL13OKXDyIX?usp=drive_link" target="_blank" rel="noopener">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18M18 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>
      </div>
      <div class="tile-body">
        <div class="tile-title">Talls de vídeos</div>
        <div class="tile-sub">Moments dels nostres partits</div>
      </div>
      <div class="tile-arrow">›</div>
    </a>

    <a class="tile" href="https://drive.google.com/drive/folders/1aplXU9WKen5_pUXY0orMq37b6WFt4Llo?usp=drive_link" target="_blank" rel="noopener">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
      <div class="tile-body">
        <div class="tile-title">Scouting rival</div>
        <div class="tile-sub">Informes de l'equip contrari</div>
      </div>
      <div class="tile-arrow">›</div>
    </a>
  </nav>

  <button id="installBtn">Instal·la l'app</button>
  <footer>Accés ràpid — Manresa</footer>
</div>

<script>
  let deferredPrompt;
  const btn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    btn.style.display = 'block';
  });
  btn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btn.style.display = 'none';
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>
</body>
</html>
