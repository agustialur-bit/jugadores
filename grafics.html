<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No miris aquí · Manresa</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11141a; --bg-raised:#181c24; --bg-raised-2:#1e2330;
    --line:#2a2f3a; --pink:#ff2d78;
    --text:#f2f1ee; --text-dim:#8b93a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:560px; margin:0 auto;}

  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .back-btn{
    width:38px; height:38px; border-radius:10px;
    background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    text-decoration:none; flex:0 0 auto;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    text-transform:uppercase; letter-spacing:.01em; margin:0;
  }
  .broma{font-size:12.5px; color:var(--text-dim); margin:0 0 22px 50px;}

  /* ---- les imatges ---- */
  .imatges{display:grid; gap:14px;}
  .imatge{
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; cursor:zoom-in;
  }
  /* Sense sostre d'alçada: la pàgina són només les imatges, o sigui que les
     deixem a la seva proporció, sense encabir-les ni escapçar-les. */
  .imatge img{width:100%; display:block; background:var(--bg-raised-2); min-height:60px;}
  .imatge-peu{padding:11px 14px; display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
  .imatge-titol{font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .imatge-data{font-size:10.5px; color:var(--text-dim); flex:0 0 auto;}
  .imatge-error{padding:14px; font-size:11.5px; color:var(--text-dim); line-height:1.45;}

  /* ---- visor a pantalla completa ---- */
  #visor{
    position:fixed; inset:0; z-index:100; background:rgba(9,11,15,.94);
    display:none; align-items:center; justify-content:center; padding:16px; cursor:zoom-out;
  }
  #visor.obert{display:flex;}
  #visor img{max-width:100%; max-height:88vh; object-fit:contain; border-radius:8px;}
  #visor .tanca{
    position:absolute; top:calc(12px + env(safe-area-inset-top)); right:14px;
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--text); font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="back-btn" aria-label="Enrere">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>No miris aquí</h1>
  </div>
  <p class="broma">T'ho havíem dit. Ara ja no ho pots desveure.</p>

  <div class="imatges" id="imatges"></div>
</div>
<div id="visor" aria-hidden="true"><button class="tanca" aria-label="Tancar">×</button><img alt=""></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxhyiqFm5fV2TWiSgBb-keqqes7jmYDqIr40mSWb8uxuHU-jN8MTH0t7XHeRVe-Yg/exec";

  /* Imatges que viuen al propi repo. Es pinten de seguida, sense esperar
     ningu. Les que hi hagi a la pestanya "Imatges" del full s'afegeixen
     despres, quan arribin. */
  const IMATGES_LOCALS = [
    { titol: 'Un cel de tirs', url: 'imatges/cel-de-tirs.jpg' },
    { titol: "L'equip", url: 'imatges/equip.jpg' }
  ];

  const escapa = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* Un enllac de compartir del Drive no es pot posar a un <img>: apunta a la
     pagina del visor, no al fitxer. N'extraiem l'identificador i muntem
     l'adreca que si el serveix, aixi es veu dins de la pagina i no cal sortir
     al Drive. Si ja ens donen una adreca d'imatge directa, la deixem tal qual. */
  function idDeDrive(url){
    const m = String(url).match(/\/file\/d\/([\w-]{10,})/) ||
              String(url).match(/[?&]id=([\w-]{10,})/) ||
              String(url).match(/\/d\/([\w-]{10,})/);
    return m ? m[1] : null;
  }
  function adrecaImatge(url, ample){
    const id = idDeDrive(url);
    return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + ample : url;
  }

  // ---- visor ----
  const visor = document.getElementById('visor');
  visor.addEventListener('click', () => visor.classList.remove('obert'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') visor.classList.remove('obert'); });
  function obreVisor(src, alt){
    const img = visor.querySelector('img');
    img.src = src; img.alt = alt || '';
    visor.classList.add('obert');
  }

  // ---- pintar ----
  const contenidor = document.getElementById('imatges');
  const jaPintades = new Set();

  function afegeix(x){
    if (!x || !x.url || jaPintades.has(x.url)) return;
    jaPintades.add(x.url);

    const petita = adrecaImatge(x.url, 1200);
    const gran = adrecaImatge(x.url, 2000);
    const card = document.createElement('div');
    card.className = 'imatge';
    card.innerHTML = '<img src="' + escapa(petita) + '" alt="' + escapa(x.titol || '') + '">' +
      '<div class="imatge-peu"><span class="imatge-titol">' + escapa(x.titol || 'Sense títol') + '</span>' +
      (x.data ? '<span class="imatge-data">' + escapa(x.data) + '</span>' : '') + '</div>';

    const img = card.querySelector('img');
    // Si el fitxer del Drive no esta compartit, Google no el serveix: ho diem
    // clar en comptes de deixar un forat negre.
    img.addEventListener('error', () => {
      img.remove();
      const avis = document.createElement('div');
      avis.className = 'imatge-error';
      avis.innerHTML = `No s'ha pogut carregar. Comprova que al Drive estigui compartida ` +
                       `com a <b>qualsevol amb l'enllaç</b>.`;
      card.prepend(avis);
      card.style.cursor = 'default';
    });
    card.addEventListener('click', () => { if (card.querySelector('img')) obreVisor(gran, x.titol); });
    contenidor.appendChild(card);
  }

  IMATGES_LOCALS.forEach(afegeix);

  /* El full nomes fa falta per a les imatges de la pestanya "Imatges". Com
     que les locals ja es veuen, aixo va en segon pla i si falla no es nota
     res. El web app d'Apps Script respon 404 de tant en tant, d'aqui els
     reintents. */
  (async function carregaDelFull(){
    const ESPERES = [1500, 4000];
    for (let i = 0; i < 3; i++){
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), 9000);
      try{
        const res = await fetch(API_URL, { cache: 'no-store', signal: ctrl.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        (d.imatges || []).forEach(afegeix);
        return;
      } catch(err){
        if (i < 2) await new Promise(r => setTimeout(r, ESPERES[i]));
      } finally { clearTimeout(id); }
    }
  })();
</script>
</body>
</html>
